# Isolated stack for the test suite. Separate volumes and host ports from the
# dev stack in docker-compose.yml, so running tests never touches seeded data.
#
#   docker compose -f docker-compose.test.yml run --rm tests
#
# Its own project name, so test containers can never be confused with — or torn
# down alongside — the dev stack in docker-compose.yml.
name: aasec-test

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aasec
      POSTGRES_PASSWORD: aasec_pw
      POSTGRES_DB: aasec_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data   # ephemeral: tests start from nothing
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aasec -d aasec_test"]
      interval: 3s
      timeout: 5s
      retries: 30

  neo4j-test:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/aasec_neo4j_pw
      NEO4J_server_memory_pagecache_size: 128M
      NEO4J_server_memory_heap_max__size: 512M
    ports:
      - "7475:7474"
      - "7688:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40

  tests:
    build: ./backend
    environment:
      POSTGRES_DSN: postgresql+psycopg://aasec:aasec_pw@postgres-test:5432/aasec_test
      NEO4J_URI: bolt://neo4j-test:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: aasec_neo4j_pw
      PYTHONPATH: /app
    volumes:
      - ./backend:/app
    depends_on:
      postgres-test:
        condition: service_healthy
      neo4j-test:
        condition: service_healthy
    command: >
      sh -c "pip install --quiet -r requirements-dev.txt &&
             pytest -q"
