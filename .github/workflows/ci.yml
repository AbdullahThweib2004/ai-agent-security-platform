name: CI

on:
  push:
  pull_request:

# A newer push to the same branch supersedes an in-flight run; main is never
# cancelled so the record of what passed there stays intact.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend — tests, lint, format
    runs-on: ubuntu-latest

    # Service-container isolation is handled by the platform, not by naming:
    # each job gets its own dedicated network and per-run container names. A
    # fixed --name would be strictly worse — on a self-hosted runner two
    # concurrent jobs would collide on the same name — so it is deliberately
    # omitted. The concurrency group above bounds parallel runs per branch.
    services:
      # Versions pinned to match docker-compose.yml. A CI that passes against
      # different engine versions than the app ships with is testing something
      # nobody runs.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aasec
          POSTGRES_PASSWORD: aasec_pw
          POSTGRES_DB: aasec_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aasec -d aasec_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/aasec_neo4j_pw
          NEO4J_server_memory_pagecache_size: 256M
          NEO4J_server_memory_heap_max__size: 512M
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "wget -q -O /dev/null http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30

    env:
      # The suite drops and rebuilds the schema from the models on every run
      # (tests/conftest.py), so CI and local behave identically — no drift.
      POSTGRES_DSN: postgresql+psycopg://aasec:aasec_pw@localhost:5432/aasec_ci
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: aasec_neo4j_pw

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          # Caches the pip *download* cache only. Resolution and installation
          # still happen every run, so a broken or yanked dependency fails here
          # rather than being masked by a restored site-packages tree.
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check --no-cache --output-format=github .

      - name: Format check (black)
        run: black --check --diff .

      - name: Wait for Neo4j to accept Bolt connections
        # The service healthcheck polls HTTP on 7474, which comes up before Bolt
        # on 7687 is ready to authenticate. Waiting on the port the app actually
        # uses avoids a flaky first test.
        run: |
          python - <<'PY'
          import sys, time
          from neo4j import GraphDatabase
          from neo4j.exceptions import Neo4jError
          deadline = time.time() + 120
          while time.time() < deadline:
              try:
                  driver = GraphDatabase.driver(
                      "bolt://localhost:7687", auth=("neo4j", "aasec_neo4j_pw")
                  )
                  driver.verify_connectivity()
                  driver.close()
                  print("neo4j bolt ready")
                  sys.exit(0)
              except (OSError, Neo4jError, Exception) as exc:
                  print(f"waiting for bolt: {type(exc).__name__}")
                  time.sleep(3)
          sys.exit("neo4j did not accept bolt connections in time")
          PY

      - name: Schema drift check
        # Fails if the migrations no longer build what the models describe.
        # This is the check whose absence let six schema changes accumulate:
        # the suite below builds its schema from the models, so it passes
        # whether or not a migration exists.
        run: python scripts/check_schema_drift.py

      - name: Run test suite
        # Unit, integration, regression, and the staged-write/reconcile tests —
        # all of which need the service containers above.
        #
        # Schema here comes from create_all + stamp (the fast path). A migration
        # that is structurally correct but fails to *run* would not be caught
        # here — the `migrations` job below is what catches that.
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: warn

  migrations:
    name: Migrations — real upgrade path
    runs-on: ubuntu-latest

    # Deliberately a separate job rather than another matrix entry: this is the
    # only place the migrations are actually *executed* against an empty
    # database and the suite then run on what they produced. The backend job
    # above builds its schema from the models, so it cannot fail on a broken
    # migration.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aasec
          POSTGRES_PASSWORD: aasec_pw
          POSTGRES_DB: aasec_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aasec -d aasec_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/aasec_neo4j_pw
          NEO4J_server_memory_pagecache_size: 256M
          NEO4J_server_memory_heap_max__size: 512M
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "wget -q -O /dev/null http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30

    env:
      POSTGRES_DSN: postgresql+psycopg://aasec:aasec_pw@localhost:5432/aasec_ci
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: aasec_neo4j_pw
      TEST_SCHEMA_MODE: migrate

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Wait for Neo4j to accept Bolt connections
        run: |
          python - <<'PY'
          import sys, time
          from neo4j import GraphDatabase
          from neo4j.exceptions import Neo4jError
          deadline = time.time() + 120
          while time.time() < deadline:
              try:
                  driver = GraphDatabase.driver(
                      "bolt://localhost:7687", auth=("neo4j", "aasec_neo4j_pw")
                  )
                  driver.verify_connectivity()
                  driver.close()
                  print("neo4j bolt ready")
                  sys.exit(0)
              except (OSError, Neo4jError, Exception) as exc:
                  print(f"waiting for bolt: {type(exc).__name__}")
                  time.sleep(3)
          sys.exit("neo4j did not accept bolt connections in time")
          PY

      - name: Run migrations against an empty database
        run: alembic upgrade head

      - name: Confirm the application starts against the migrated schema
        # The startup check refuses to run unless alembic_version matches head,
        # so this proves the migration left the database in the state the
        # application demands — not merely that it executed without error.
        run: |
          python -c "
          from app.db.postgres import init_db
          print('application accepted schema at revision', init_db())
          "

      - name: Run the suite against the migration-built schema
        run: pytest -q

  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          # npm's download cache only; node_modules is still installed fresh so a
          # genuine resolution failure is not hidden by a restored tree.
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # `npm ci` installs exactly what the lockfile pins and fails if the
        # lockfile and package.json have drifted apart — which is the point.
        run: npm ci

      - name: Tests
        # There is no frontend test suite yet. Run it when one appears, and do
        # not silently pass if the script exists but fails.
        run: |
          if npm run | grep -qE '^  test$'; then
            npm test
          else
            echo "no frontend test script defined — skipping"
          fi

      - name: Build
        run: npm run build

  ci:
    # Single required status check. Every job above must succeed; a skipped or
    # cancelled job is not a pass.
    name: CI
    runs-on: ubuntu-latest
    needs: [backend, migrations, frontend]
    if: always()
    steps:
      - name: Verify all jobs succeeded
        run: |
          echo "backend:    ${{ needs.backend.result }}"
          echo "migrations: ${{ needs.migrations.result }}"
          echo "frontend:   ${{ needs.frontend.result }}"
          if [ "${{ needs.backend.result }}" != "success" ] || \
             [ "${{ needs.migrations.result }}" != "success" ] || \
             [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "::error::One or more CI jobs failed."
            exit 1
          fi
          echo "All CI jobs passed."
