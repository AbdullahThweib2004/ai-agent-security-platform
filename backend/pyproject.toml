[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = [
    "integration: exercises real Postgres and Neo4j",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# Cypher/SQL literals and long docstrings read worse when force-wrapped.
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI expresses dependency injection and parameter metadata as calls in
# argument defaults. B008 exists to catch accidental shared mutable defaults;
# these are the framework's documented idiom, not that mistake.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
