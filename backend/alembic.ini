# Alembic configuration.
#
# `sqlalchemy.url` is deliberately absent: the connection string comes from
# app.config at runtime (env.py), so there is exactly one place that knows how
# to reach Postgres and no chance of this file drifting from the application's
# own settings.
[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# Migration filenames sort chronologically and say what they do.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
